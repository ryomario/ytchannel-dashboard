<style>
  /* ==========================================
     DESIGN SYSTEM & THEME TOKENS
     ========================================== */
  :root {
    /* Telegram Theme Integration & Fallbacks */
    --bg-color: var(--tg-theme-bg-color, #0f172a);
    --secondary-bg-color: var(--tg-theme-secondary-bg-color, #1e293b);
    --text-color: var(--tg-theme-text-color, #f8fafc);
    --hint-color: var(--tg-theme-hint-color, #94a3b8);
    --link-color: var(--tg-theme-link-color, #38bdf8);
    --button-color: var(--tg-theme-button-color, #2563eb);
    --button-text-color: var(--tg-theme-button-text-color, #ffffff);

    /* YouTube & Telegram Accents */
    --yt-red: #ff0000;
    --yt-red-bright: #ff4444;
    --yt-red-glow: rgba(255, 0, 0, 0.25);
    --tg-blue: #2aabee;
    --tg-blue-glow: rgba(42, 171, 238, 0.25);
    --success-green: #10b981;
    
    /* Glassmorphism Variables */
    --glass-bg: rgba(30, 41, 59, 0.65);
    --glass-card-bg: rgba(255, 255, 255, 0.05);
    --glass-card-hover: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.12);
    --glass-border-light: rgba(255, 255, 255, 0.18);
    --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);

    /* Spacing & Radius */
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --radius-full: 9999px;
  }

  /* Reset & Box Sizing */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    min-height: 100vh;
    padding-bottom: 90px; /* Offset for bottom nav */
    overflow-x: hidden;
    line-height: 1.5;
  }

  /* Scrollbar */
  ::-webkit-scrollbar {
    width: 4px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 4px;
  }

  /* ==========================================
     LAYOUT & CONTAINERS
     ========================================== */
  .app-header {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--glass-border);
  }

  .channel-info {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .channel-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--yt-red-bright);
    box-shadow: 0 0 10px var(--yt-red-glow);
  }

  .channel-details {
    display: flex;
    flex-direction: column;
  }

  .channel-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-color);
    line-height: 1.2;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .badge-live {
    font-size: 0.65rem;
    padding: 2px 6px;
    background: rgba(16, 185, 129, 0.2);
    color: var(--success-green);
    border: 1px solid rgba(16, 185, 129, 0.4);
    border-radius: var(--radius-full);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .channel-handle {
    font-size: 0.75rem;
    color: var(--hint-color);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .icon-btn {
    background: var(--glass-card-bg);
    border: 1px solid var(--glass-border);
    color: var(--text-color);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .icon-btn:active {
    transform: scale(0.92);
    background: var(--glass-card-hover);
  }

  .icon-btn svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  /* Main Container */
  .main-content {
    padding: 16px;
    max-width: 600px;
    margin: 0 auto;
  }

  .tab-pane {
    display: none;
    animation: fadeIn 0.25s ease-in-out forwards;
  }

  .tab-pane.active {
    display: block;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Section Headings */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .section-title {
    font-size: 0.95rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--hint-color);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title svg {
    width: 16px;
    height: 16px;
    fill: var(--yt-red-bright);
  }

  /* ==========================================
     FEATURE 1: KPI CARDS
     ========================================== */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  .kpi-card {
    background: var(--glass-card-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-md);
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }

  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--yt-red), var(--tg-blue));
    opacity: 0.7;
  }

  .kpi-card:active {
    transform: translateY(-2px);
    border-color: var(--glass-border-light);
  }

  .kpi-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 6px;
    color: var(--yt-red-bright);
  }

  .kpi-icon svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }

  .kpi-value {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--text-color);
    line-height: 1.2;
  }

  .kpi-label {
    font-size: 0.7rem;
    color: var(--hint-color);
    margin-top: 2px;
    font-weight: 500;
  }

  /* ==========================================
     FEATURE 2: LATEST VIDEOS PERFORMANCE TRACKER
     ========================================== */
  .video-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .video-card {
    background: var(--glass-card-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-md);
    padding: 10px;
    display: flex;
    gap: 12px;
    text-decoration: none;
    color: inherit;
    transition: all 0.2s ease;
    cursor: pointer;
  }

  .video-card:active {
    transform: scale(0.98);
    background: var(--glass-card-hover);
    border-color: var(--yt-red-glow);
  }

  .video-thumb-wrapper {
    position: relative;
    width: 110px;
    height: 62px;
    border-radius: var(--radius-sm);
    overflow: hidden;
    flex-shrink: 0;
    background: rgba(0,0,0,0.3);
  }

  .video-thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .play-badge {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.25);
    transition: background 0.2s ease;
  }

  .play-badge svg {
    width: 22px;
    height: 22px;
    fill: #ffffff;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }

  .video-info {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    flex: 1;
    min-width: 0; /* Prevents text overflow */
  }

  .video-title {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-color);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.3;
  }

  .video-meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 0.72rem;
    color: var(--hint-color);
  }

  .video-stats-pills {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .stat-pill {
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--hint-color);
  }

  .stat-pill svg {
    width: 12px;
    height: 12px;
    fill: currentColor;
  }

  .stat-pill.views {
    color: var(--tg-blue);
  }

  /* ==========================================
     FEATURE 3: CONTENT PLANNER & IDEA BOARD
     ========================================== */
  .quick-add-box {
    background: var(--glass-card-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-md);
    padding: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }

  .quick-add-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-color);
    font-size: 0.88rem;
    padding: 8px 12px;
  }

  .quick-add-input::placeholder {
    color: var(--hint-color);
  }

  .btn-add-idea {
    background: linear-gradient(135deg, var(--yt-red), var(--yt-red-bright));
    color: #ffffff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 8px 14px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px var(--yt-red-glow);
  }

  .btn-add-idea:active {
    transform: scale(0.94);
  }

  .btn-add-idea svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
  }

  /* Filter Pills */
  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    background: rgba(0, 0, 0, 0.2);
    padding: 4px;
    border-radius: var(--radius-md);
    border: 1px solid var(--glass-border);
  }

  .filter-pill {
    flex: 1;
    text-align: center;
    padding: 6px 12px;
    font-size: 0.78rem;
    font-weight: 600;
    border-radius: var(--radius-sm);
    color: var(--hint-color);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .filter-pill.active {
    background: var(--glass-card-hover);
    color: var(--text-color);
    border: 1px solid var(--glass-border-light);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  }

  .filter-count {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.1);
    font-size: 0.7rem;
    margin-left: 4px;
  }

  .idea-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .idea-card {
    background: var(--glass-card-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    transition: all 0.2s ease;
  }

  .idea-card.completed {
    opacity: 0.6;
    border-color: rgba(255, 255, 255, 0.05);
  }

  .idea-card.completed .idea-text {
    text-decoration: line-through;
    color: var(--hint-color);
  }

  .idea-text {
    font-size: 0.88rem;
    color: var(--text-color);
    word-break: break-word;
    flex: 1;
  }

  .idea-checkbox-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--glass-border-light);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s ease;
  }

  .idea-card.completed .idea-checkbox-btn {
    background: var(--success-green);
    border-color: var(--success-green);
  }

  .idea-checkbox-btn svg {
    width: 14px;
    height: 14px;
    fill: #ffffff;
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  .idea-card.completed .idea-checkbox-btn svg {
    opacity: 1;
  }

  /* ==========================================
     FEATURE 4: SEARCH & TOPIC INSPECTOR
     ========================================== */
  .search-box {
    position: relative;
    margin-bottom: 16px;
  }

  .search-input {
    width: 100%;
    background: var(--glass-card-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-md);
    padding: 12px 42px 12px 14px;
    color: var(--text-color);
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .search-input:focus {
    border-color: var(--tg-blue);
  }

  .search-icon-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    color: var(--hint-color);
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .search-icon-btn svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  .empty-state {
    text-align: center;
    padding: 30px 16px;
    color: var(--hint-color);
  }

  .empty-state svg {
    width: 48px;
    height: 48px;
    fill: var(--glass-border-light);
    margin-bottom: 10px;
  }

  .empty-state p {
    font-size: 0.85rem;
  }

  /* ==========================================
     FEATURE 5: TELEGRAM BOTTOM DOCK NAV
     ========================================== */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--glass-border);
    display: flex;
    justify-content: space-around;
    padding: 8px 12px 12px;
    max-width: 600px;
    margin: 0 auto;
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--hint-color);
    text-decoration: none;
    font-size: 0.7rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    flex: 1;
    position: relative;
  }

  .nav-item.active {
    color: var(--yt-red-bright);
  }

  .nav-item svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
    transition: transform 0.2s ease;
  }

  .nav-item.active svg {
    transform: translateY(-2px);
  }

  .nav-item.active::after {
    content: '';
    position: absolute;
    bottom: -6px;
    width: 16px;
    height: 3px;
    background: var(--yt-red-bright);
    border-radius: 2px;
    box-shadow: 0 0 8px var(--yt-red-bright);
  }

  /* ==========================================
     SKELETON SHIMMER LOADING ANIMS
     ========================================== */
  .skeleton {
    background: linear-gradient(
      90deg,
      rgba(255, 255, 255, 0.03) 25%,
      rgba(255, 255, 255, 0.08) 37%,
      rgba(255, 255, 255, 0.03) 63%
    );
    background-size: 400% 100%;
    animation: skeleton-loading 1.4s ease infinite;
    border-radius: var(--radius-sm);
  }

  @keyframes skeleton-loading {
    0% {
      background-position: 100% 50%;
    }
    100% {
      background-position: 0% 50%;
    }
  }
</style>
