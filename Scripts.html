<script>
  /* ==========================================
     GLOBAL STATE & TELEGRAM SDK INIT
     ========================================== */
  const state = {
    channel: null,
    latestVideos: [],
    ideas: [],
    activeIdeaFilter: 'pending' // 'pending' | 'completed'
  };

  const tg = window.Telegram ? window.Telegram.WebApp : null;

  document.addEventListener('DOMContentLoaded', () => {
    initTelegramApp();
    refreshDashboardData();
  });

  function initTelegramApp() {
    if (tg) {
      try {
        tg.ready();
        tg.expand();
        // Sync header color with Telegram theme background
        if (tg.setHeaderColor) {
          tg.setHeaderColor('bg_color');
        }
      } catch (e) {
        console.warn("Telegram WebApp initialization warning:", e);
      }
    }
  }

  function triggerHaptic(style = 'light') {
    if (tg && tg.HapticFeedback) {
      try {
        if (style === 'selection') {
          tg.HapticFeedback.selectionChanged();
        } else {
          tg.HapticFeedback.impactOccurred(style); // 'light' | 'medium' | 'heavy'
        }
      } catch (e) {
        console.warn("Haptic feedback error:", e);
      }
    }
  }

  // ==========================================
  // TAB NAVIGATION CONTROLLER
  // ==========================================
  function switchTab(tabName) {
    triggerHaptic('selection');

    // Update bottom nav active classes
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => item.classList.remove('active'));

    const targetNav = document.getElementById('nav-' + tabName);
    if (targetNav) targetNav.classList.add('active');

    // Update tab panes visibility
    const panes = document.querySelectorAll('.tab-pane');
    panes.forEach(pane => pane.classList.remove('active'));

    const targetPane = document.getElementById('tab-' + tabName);
    if (targetPane) targetPane.classList.add('active');
  }

  // ==========================================
  // DATA FETCHING & RPC HANDLERS
  // ==========================================
  function refreshDashboardData() {
    triggerHaptic('light');
    showLoadingSkeletons();

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(handleDashboardDataSuccess)
        .withFailureHandler(handleDashboardDataError)
        .getChannelDashboardData();
    } else {
      console.log("google.script.run not found. Using local browser preview mock data.");
      setTimeout(() => {
        handleDashboardDataSuccess({
          success: true,
          channel: {
            title: 'My YouTube Channel',
            customUrl: '@mychannel',
            avatarUrl: 'https://cdn-icons-png.flaticon.com/512/1384/1384060.png',
            subscriberCount: 12500,
            viewCount: 485000,
            videoCount: 84
          },
          latestVideos: [
            {
              id: 'vid_1',
              title: 'Membuat Telegram Mini App dengan Google Apps Script dari Nol! 🚀',
              publishedAt: new Date(Date.now() - 86400000 * 2).toISOString(),
              thumbnailUrl: 'https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=500&auto=format&fit=crop&q=60',
              videoUrl: 'https://www.youtube.com',
              viewCount: 4520,
              likeCount: 382,
              commentCount: 45
            },
            {
              id: 'vid_2',
              title: 'Tips Koding Efisien Menggunakan Antigravity AI Agent & GAS Web App',
              publishedAt: new Date(Date.now() - 86400000 * 5).toISOString(),
              thumbnailUrl: 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=500&auto=format&fit=crop&q=60',
              videoUrl: 'https://www.youtube.com',
              viewCount: 8910,
              likeCount: 710,
              commentCount: 89
            },
            {
              id: 'vid_3',
              title: 'Shorts 60s: Caraku Mengelola Channel YouTube Pakai Telegram Bot',
              publishedAt: new Date(Date.now() - 86400000 * 9).toISOString(),
              thumbnailUrl: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format&fit=crop&q=60',
              videoUrl: 'https://www.youtube.com',
              viewCount: 15300,
              likeCount: 1420,
              commentCount: 112
            }
          ],
          ideas: [
            {
              id: 'idea_1',
              text: 'Bikin tutorial Telegram Mini App menggunakan Google Apps Script',
              status: 'pending',
              createdAt: new Date().toISOString()
            },
            {
              id: 'idea_2',
              text: 'Shorts 60s: 3 Tips Optimasi YouTube Data API v3 di GAS',
              status: 'pending',
              createdAt: new Date().toISOString()
            },
            {
              id: 'idea_3',
              text: 'Review fitur Glassmorphism Telegram Dark Mode UI',
              status: 'completed',
              createdAt: new Date().toISOString()
            }
          ]
        });
      }, 600);
    }
  }

  function handleDashboardDataSuccess(res) {
    if (!res || !res.success) {
      console.error("Dashboard RPC Error:", res ? res.error : "Unknown error");
      return;
    }

    state.channel = res.channel;
    state.latestVideos = res.latestVideos || [];
    state.ideas = res.ideas || [];

    renderHeader();
    renderKPICards();
    renderVideoLists();
    renderIdeas();
  }

  function handleDashboardDataError(err) {
    console.error("Failed to fetch dashboard data:", err);
  }

  function showLoadingSkeletons() {
    document.getElementById('kpiSubs').innerText = '...';
    document.getElementById('kpiViews').innerText = '...';
    document.getElementById('kpiVideos').innerText = '...';
  }

  // ==========================================
  // RENDER FUNCTIONS
  // ==========================================
  function renderHeader() {
    if (!state.channel) return;
    const titleEl = document.getElementById('channelTitle');
    const handleEl = document.getElementById('channelHandle');
    const avatarEl = document.getElementById('channelAvatar');

    if (titleEl) titleEl.innerText = state.channel.title || 'YouTube Channel';
    if (handleEl) handleEl.innerText = state.channel.customUrl || '@channel';
    if (avatarEl && state.channel.avatarUrl) avatarEl.src = state.channel.avatarUrl;
  }

  function renderKPICards() {
    if (!state.channel) return;
    document.getElementById('kpiSubs').innerText = formatCompactNumber(state.channel.subscriberCount || 0);
    document.getElementById('kpiViews').innerText = formatCompactNumber(state.channel.viewCount || 0);
    document.getElementById('kpiVideos').innerText = formatNumberWithCommas(state.channel.videoCount || 0);
  }

  function renderVideoLists() {
    const dashListEl = document.getElementById('dashVideoList');
    const fullListEl = document.getElementById('fullVideoList');

    if (!state.latestVideos || state.latestVideos.length === 0) {
      const emptyHtml = `<div class="empty-state"><p>Belum ada video yang diunggah.</p></div>`;
      if (dashListEl) dashListEl.innerHTML = emptyHtml;
      if (fullListEl) fullListEl.innerHTML = emptyHtml;
      return;
    }

    const videosHtml = state.latestVideos.map(video => buildVideoCardHtml(video)).join('');
    
    if (dashListEl) dashListEl.innerHTML = videosHtml;
    if (fullListEl) fullListEl.innerHTML = videosHtml;
  }

  function buildVideoCardHtml(video) {
    const formattedViews = formatCompactNumber(video.viewCount || 0);
    const formattedLikes = formatCompactNumber(video.likeCount || 0);
    const formattedComments = formatCompactNumber(video.commentCount || 0);
    const relativeTime = getRelativeTimeString(video.publishedAt);

    return `
      <div class="video-card" onclick="openVideoLink('${video.videoUrl}')">
        <div class="video-thumb-wrapper">
          <img src="${video.thumbnailUrl}" alt="Thumbnail" class="video-thumb" loading="lazy">
          <div class="play-badge">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
        <div class="video-info">
          <div class="video-title">${escapeHtml(video.title)}</div>
          <div class="video-meta-row">
            <div class="video-stats-pills">
              <span class="stat-pill views">
                <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                ${formattedViews}
              </span>
              <span class="stat-pill">
                <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
                ${formattedLikes}
              </span>
              <span class="stat-pill">
                <svg viewBox="0 0 24 24"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18z"/></svg>
                ${formattedComments}
              </span>
            </div>
            <span>${relativeTime}</span>
          </div>
        </div>
      </div>
    `;
  }

  function openVideoLink(url) {
    triggerHaptic('medium');
    if (tg && tg.openLink) {
      tg.openLink(url);
    } else {
      window.open(url, '_blank');
    }
  }

  // ==========================================
  // IDEAS BOARD LOGIC & RENDERING
  // ==========================================
  function setIdeaFilter(filterType) {
    triggerHaptic('selection');
    state.activeIdeaFilter = filterType;

    document.getElementById('filterPending').classList.toggle('active', filterType === 'pending');
    document.getElementById('filterCompleted').classList.toggle('active', filterType === 'completed');

    renderIdeas();
  }

  function renderIdeas() {
    const container = document.getElementById('ideaContainer');
    if (!container) return;

    const pendingIdeas = state.ideas.filter(i => i.status === 'pending');
    const completedIdeas = state.ideas.filter(i => i.status === 'completed');

    // Update Pill Count Badges
    document.getElementById('countPending').innerText = pendingIdeas.length;
    document.getElementById('countCompleted').innerText = completedIdeas.length;

    const displayList = state.activeIdeaFilter === 'pending' ? pendingIdeas : completedIdeas;

    if (displayList.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg>
          <p>${state.activeIdeaFilter === 'pending' ? 'Belum ada ide konten aktif.' : 'Belum ada ide yang diselesaikan.'}</p>
        </div>
      `;
      return;
    }

    container.innerHTML = displayList.map(idea => `
      <div class="idea-card ${idea.status === 'completed' ? 'completed' : ''}">
        <div class="idea-text">${escapeHtml(idea.text)}</div>
        <button class="idea-checkbox-btn" title="Mark Done" onclick="toggleIdeaDone('${idea.id}')">
          <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </button>
      </div>
    `).join('');
  }

  function handleIdeaKeyPress(e) {
    if (e.key === 'Enter') {
      submitNewIdea();
    }
  }

  function submitNewIdea() {
    const input = document.getElementById('ideaInput');
    const text = input.value ? input.value.trim() : '';

    if (!text) return;

    triggerHaptic('medium');
    input.value = '';

    // Optimistic UI update
    const tempIdea = {
      id: 'idea_' + Date.now(),
      text: text,
      status: 'pending',
      createdAt: new Date().toISOString()
    };
    state.ideas.unshift(tempIdea);
    renderIdeas();

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(res => {
          if (res && res.success) {
            state.ideas = res.ideas;
            renderIdeas();
          }
        })
        .addNewIdeaFromWebApp(text);
    }
  }

  function toggleIdeaDone(ideaId) {
    triggerHaptic('medium');

    // Optimistic UI update
    state.ideas = state.ideas.map(idea => {
      if (idea.id === ideaId || String(idea.id) === String(ideaId)) {
        idea.status = idea.status === 'completed' ? 'pending' : 'completed';
      }
      return idea;
    });
    renderIdeas();

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(res => {
          if (res && res.success) {
            state.ideas = res.ideas;
            renderIdeas();
          }
        })
        .markIdeaDoneFromWebApp(ideaId);
    }
  }

  // ==========================================
  // SEARCH & TOPIC INSPECTOR LOGIC
  // ==========================================
  function handleSearchKeyPress(e) {
    if (e.key === 'Enter') {
      executeSearch();
    }
  }

  function executeSearch() {
    const input = document.getElementById('searchInput');
    const query = input.value ? input.value.trim() : '';

    if (!query) return;

    triggerHaptic('light');
    const container = document.getElementById('searchResultsContainer');
    if (container) {
      container.innerHTML = `
        <div class="video-card skeleton" style="height: 82px;"></div>
        <div class="video-card skeleton" style="height: 82px;"></div>
      `;
    }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(res => {
          if (res && res.success) {
            renderSearchResults(res.videos);
          } else {
            renderSearchResults([]);
          }
        })
        .searchVideosFromWebApp(query);
    } else {
      // Mock local search filter
      setTimeout(() => {
        const filtered = state.latestVideos.filter(v => 
          v.title.toLowerCase().includes(query.toLowerCase())
        );
        renderSearchResults(filtered);
      }, 400);
    }
  }

  function renderSearchResults(videos) {
    const container = document.getElementById('searchResultsContainer');
    if (!container) return;

    if (!videos || videos.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <p>Tidak ada video yang cocok dengan pencarian kamu.</p>
        </div>
      `;
      return;
    }

    container.innerHTML = videos.map(v => buildVideoCardHtml(v)).join('');
  }

  // ==========================================
  // UTILITY HELPER FUNCTIONS
  // ==========================================
  function formatCompactNumber(num) {
    if (num >= 1000000) {
      return (num / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    }
    if (num >= 1000) {
      return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
    }
    return num.toString();
  }

  function formatNumberWithCommas(num) {
    return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  }

  function getRelativeTimeString(isoDateStr) {
    if (!isoDateStr) return '';
    const date = new Date(isoDateStr);
    const now = new Date();
    const diffSec = Math.floor((now - date) / 1000);

    if (diffSec < 3600) {
      const mins = Math.max(1, Math.floor(diffSec / 60));
      return `${mins}m ago`;
    }
    if (diffSec < 86400) {
      const hours = Math.floor(diffSec / 3600);
      return `${hours}h ago`;
    }
    const days = Math.floor(diffSec / 86400);
    if (days < 30) {
      return `${days}d ago`;
    }
    const months = Math.floor(days / 30);
    return `${months}mo ago`;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
</script>
