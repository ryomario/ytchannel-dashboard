<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YouTube Channel Observer</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Include Server-Side CSS -->
  <?!= include('Styles'); ?>
</head>
<body>

  <!-- App Sticky Header -->
  <header class="app-header">
    <div class="channel-info">
      <img id="channelAvatar" src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="Channel Avatar" class="channel-avatar">
      <div class="channel-details">
        <div class="channel-title">
          <span id="channelTitle">YouTube Channel</span>
          <span class="badge-live">LIVE</span>
        </div>
        <span id="channelHandle" class="channel-handle">@observer</span>
      </div>
    </div>

    <div class="header-actions">
      <button id="btnRefresh" class="icon-btn" title="Refresh Data" onclick="refreshDashboardData()">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>
  </header>

  <!-- Main Content Viewport -->
  <main class="main-content">

    <!-- ==========================================
         TAB 1: DASHBOARD (KPI & HIGHLIGHTS)
         ========================================== -->
    <section id="tab-dashboard" class="tab-pane active">
      
      <!-- Feature 1: KPI Cards -->
      <div class="section-header">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14h-2v-4h2v4zm0-6h-2V7h2v4zm4 6h-2V9h2v8zm0-10h-2V7h2v2z"/></svg>
          Channel Metrics
        </h2>
      </div>

      <div class="kpi-grid">
        <!-- Subscribers KPI -->
        <div class="kpi-card">
          <div class="kpi-icon">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
          </div>
          <div id="kpiSubs" class="kpi-value">--</div>
          <div class="kpi-label">Subscribers</div>
        </div>

        <!-- Lifetime Views KPI -->
        <div class="kpi-card">
          <div class="kpi-icon">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </div>
          <div id="kpiViews" class="kpi-value">--</div>
          <div class="kpi-label">Total Views</div>
        </div>

        <!-- Total Videos KPI -->
        <div class="kpi-card">
          <div class="kpi-icon">
            <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
          </div>
          <div id="kpiVideos" class="kpi-value">--</div>
          <div class="kpi-label">Published</div>
        </div>
      </div>

      <!-- Feature 2: Latest Videos Preview -->
      <div class="section-header" style="margin-top: 24px;">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
          Latest Uploads
        </h2>
      </div>

      <div id="dashVideoList" class="video-list">
        <!-- Rendered via JS -->
        <div class="video-card skeleton" style="height: 82px;"></div>
        <div class="video-card skeleton" style="height: 82px;"></div>
      </div>
    </section>


    <!-- ==========================================
         TAB 2: VIDEOS LIST TRACKER
         ========================================== -->
    <section id="tab-videos" class="tab-pane">
      <div class="section-header">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/></svg>
          Video Performance Tracker
        </h2>
      </div>

      <div id="fullVideoList" class="video-list">
        <!-- Rendered via JS -->
      </div>
    </section>


    <!-- ==========================================
         TAB 3: CONTENT PLANNER & IDEAS BOARD
         ========================================== -->
    <section id="tab-ideas" class="tab-pane">
      <div class="section-header">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg>
          Content Planner & Ideas
        </h2>
      </div>

      <!-- Quick Add Input -->
      <div class="quick-add-box">
        <input type="text" id="ideaInput" class="quick-add-input" placeholder="Tulis ide konten Shorts baru..." onkeypress="handleIdeaKeyPress(event)">
        <button class="btn-add-idea" onclick="submitNewIdea()">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          Tambah
        </button>
      </div>

      <!-- Status Filter Bar -->
      <div class="filter-bar">
        <div id="filterPending" class="filter-pill active" onclick="setIdeaFilter('pending')">
          Aktif / Pending <span id="countPending" class="filter-count">0</span>
        </div>
        <div id="filterCompleted" class="filter-pill" onclick="setIdeaFilter('completed')">
          Selesai <span id="countCompleted" class="filter-count">0</span>
        </div>
      </div>

      <!-- Idea Checklist Container -->
      <div id="ideaContainer" class="idea-list">
        <!-- Rendered via JS -->
      </div>
    </section>


    <!-- ==========================================
         TAB 4: SEARCH & TOPIC INSPECTOR
         ========================================== -->
    <section id="tab-search" class="tab-pane">
      <div class="section-header">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          Topic & Search Inspector
        </h2>
      </div>

      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Cari judul video atau topik..." onkeypress="handleSearchKeyPress(event)">
        <button class="search-icon-btn" onclick="executeSearch()">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
      </div>

      <div id="searchResultsContainer" class="video-list">
        <div class="empty-state">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <p>Ketik kata kunci untuk mencari video di channel kamu</p>
        </div>
      </div>
    </section>

  </main>

  <!-- Fixed Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <div id="nav-dashboard" class="nav-item active" onclick="switchTab('dashboard')">
      <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
      <span>Dashboard</span>
    </div>
    <div id="nav-videos" class="nav-item" onclick="switchTab('videos')">
      <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
      <span>Videos</span>
    </div>
    <div id="nav-ideas" class="nav-item" onclick="switchTab('ideas')">
      <svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg>
      <span>Ideas</span>
    </div>
    <div id="nav-search" class="nav-item" onclick="switchTab('search')">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <span>Search</span>
    </div>
  </nav>

  <!-- Include Server-Side JS -->
  <?!= include('Scripts'); ?>
</body>
</html>
